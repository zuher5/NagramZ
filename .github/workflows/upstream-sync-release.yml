name: Upstream Sync & Release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no upstream changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-sync-release
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Upstream
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync_step.outputs.has_changes }}
      upstream_sha: ${{ steps.sync_step.outputs.upstream_sha }}
      head_sha: ${{ steps.sync_step.outputs.head_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Sync Upstream
        id: sync_step
        run: |
          git remote add upstream https://github.com/HSSkyBoy/NiagramX.git || true
          git fetch upstream dev

          LOCAL_DEV=$(git rev-parse HEAD)
          UPSTREAM_DEV=$(git rev-parse upstream/dev)
          MERGE_BASE=$(git merge-base HEAD upstream/dev)

          echo "LOCAL_DEV: $LOCAL_DEV"
          echo "UPSTREAM_DEV: $UPSTREAM_DEV"
          echo "MERGE_BASE: $MERGE_BASE"

          echo "upstream_sha=$UPSTREAM_DEV" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_DEV" = "$MERGE_BASE" ]; then
            echo "No new commits in upstream."
            if [ "${{ inputs.force_build }}" = "true" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
              echo "force_build enabled. Proceeding to build."
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "head_sha=$LOCAL_DEV" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "head_sha=none" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "New upstream commits detected. Reapplying custom commits via rebase..."
          if git rebase upstream/dev; then
            echo "Rebase succeeded cleanly."
            NEW_HEAD=$(git rev-parse HEAD)
            git push origin dev --force-with-lease -o ci.skip
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=$NEW_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Rebase failed due to merge conflicts! Aborting to keep repository safe."
            git rebase --abort
            exit 1
          fi

  build:
    name: Build APK (${{ matrix.target }})
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' && needs.sync.outputs.has_changes != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [arm64-v8a, universal]
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,time_macros"
      CCACHE_BASEDIR: "${{ github.workspace }}"
      NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.workflow }}-${{ matrix.target }}-${{ github.ref_name }}
          restore-keys: |
            ${{ github.workflow }}-${{ matrix.target }}-
            ${{ matrix.target }}-
          append-timestamp: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.1.0 ndk;27.2.12479018 platforms;android-37.0"

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          elif [ $MEMORY_GB -ge 6 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1536M -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      - name: Staging Build
        id: staging_build_step
        env:
          COMMIT_ID: ${{ needs.sync.outputs.head_sha }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ vars.ALIAS_NAME || secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          if [ -n "$LOCAL_PROPERTIES" ]; then
            echo "$LOCAL_PROPERTIES" | base64 -d >> local.properties
          fi
          SIGNING_FLAGS=""
          if [ -z "$KEYSTORE_PASS" ] && [ -z "$LOCAL_PROPERTIES" ]; then
            echo "No signing credentials provided. Building unsigned/withoutSigning APK."
            SIGNING_FLAGS="-PwithoutSigning"
          fi
          ./gradlew TMessagesProj:assembleStaging $SIGNING_FLAGS --build-cache --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiagramXZ-${{ matrix.target }}
          path: TMessagesProj/build/outputs/apk/staging/*.apk

  release:
    name: Create GitHub Release
    needs: [sync, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Determine Version and Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ needs.sync.outputs.head_sha }}
        run: |
          APP_VER_NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          VER_CODE=$(grep 'def verCode =' TMessagesProj/build.gradle | head -n1 | tr -dc '0-9')
          SHORT_SHA=${COMMIT_SHA:0:7}
          
          TAG_NAME="v${APP_VER_NAME}.${VER_CODE}-${SHORT_SHA}"
          RELEASE_TITLE="NiagramXZ ${APP_VER_NAME} (${VER_CODE})"

          echo "Creating Release tag: $TAG_NAME"

          printf "%s\n" \
            "Automated build of NiagramXZ synchronized with upstream NiagramX." \
            "" \
            "- **Upstream Commit**: ${{ needs.sync.outputs.upstream_sha }}" \
            "- **NiagramXZ Commit**: ${{ needs.sync.outputs.head_sha }}" \
            "- **Features**: Custom Native Android SplashScreen with NiagramX official icon" > release_notes.md

          gh release create "$TAG_NAME" apks/*.apk \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target dev


