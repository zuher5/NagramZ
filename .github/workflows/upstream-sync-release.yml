name: Upstream Sync & Release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no upstream changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-sync-release
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Upstream
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync_step.outputs.has_changes }}
      upstream_sha: ${{ steps.sync_step.outputs.upstream_sha }}
      head_sha: ${{ steps.sync_step.outputs.head_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Sync Upstream
        id: sync_step
        run: |
          set -uo pipefail
          git remote add upstream https://github.com/HSSkyBoy/NiagramX.git || true
          git fetch upstream dev

          LOCAL_DEV=$(git rev-parse HEAD)
          UPSTREAM_DEV=$(git rev-parse upstream/dev)
          MERGE_BASE=$(git merge-base HEAD upstream/dev)

          echo "LOCAL_DEV: $LOCAL_DEV"
          echo "UPSTREAM_DEV: $UPSTREAM_DEV"
          echo "MERGE_BASE: $MERGE_BASE"

          echo "upstream_sha=$UPSTREAM_DEV" >> "$GITHUB_OUTPUT"

          if [ "$UPSTREAM_DEV" = "$MERGE_BASE" ]; then
            echo "No new commits in upstream."
            if [ "${{ inputs.force_build }}" = "true" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
              echo "force_build enabled. Proceeding to build."
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "head_sha=$LOCAL_DEV" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "head_sha=none" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "New upstream commits detected. Merging upstream/dev..."
          # -X ours: hunk yang bentrok memakai versi fork (branding + fitur kita),
          # hunk yang tidak bentrok tetap memakai versi upstream.
          if git merge --no-edit -X ours upstream/dev; then
            echo "Merge finished without manual conflicts."
          else
            echo "::warning::Merge left unresolved paths, keeping the fork version of those files."
            git diff --name-only --diff-filter=U | while read -r path; do
              echo "  resolving in favour of fork: $path"
              git checkout --ours -- "$path" 2>/dev/null || git rm --cached -f "$path" 2>/dev/null || true
              git add "$path" 2>/dev/null || true
            done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::Could not resolve all conflicts, aborting."
              exit 1
            fi
            git commit --no-edit -m "chore(sync): merge upstream/dev (keep fork customisations)"
          fi

          NEW_HEAD=$(git rev-parse HEAD)
          echo "Merged head: $NEW_HEAD"
          echo "head_sha=$NEW_HEAD" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Verify fork guardrails
        run: |
          set -uo pipefail
          fail=0
          if ! grep -q '^APP_PACKAGE=top.nkbe.niagram$' gradle.properties; then
            echo "::error::APP_PACKAGE changed, in-place updates would break"
            fail=1
          fi
          if [ ! -f TMessagesProj/release.keystore ]; then
            echo "::error::TMessagesProj/release.keystore is missing"
            fail=1
          fi
          if ! git ls-files --error-unmatch TMessagesProj/release.keystore >/dev/null 2>&1; then
            echo "::error::TMessagesProj/release.keystore is not tracked by git"
            fail=1
          fi
          if ! grep -q 'nagramz123' TMessagesProj/build.gradle; then
            echo "::error::signing configuration is missing from build.gradle"
            fail=1
          fi
          if [ ! -x ci/apply-branding.sh ]; then
            echo "::error::ci/apply-branding.sh is missing or not executable"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::Fork guardrails failed, nothing was pushed."
            exit 1
          fi
          echo "All fork guardrails passed."

      - name: Push merged branch
        run: git push origin dev -o ci.skip

  build:
    name: Build APK (${{ matrix.target }})
    needs: sync
    if: needs.sync.outputs.has_changes == 'true' && needs.sync.outputs.has_changes != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [arm64-v8a]
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOSANDBOX: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,time_macros"
      CCACHE_BASEDIR: "${{ github.workspace }}"
      NATIVE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1
          submodules: recursive

      - name: Apply native patches
        working-directory: TMessagesProj/jni
        run: ./patches/tgcalls.sh

      - name: Apply NagramZ branding
        run: ./ci/apply-branding.sh

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.workflow }}-${{ matrix.target }}-${{ github.ref_name }}
          restore-keys: |
            ${{ github.workflow }}-${{ matrix.target }}-
            ${{ matrix.target }}-
          append-timestamp: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: 14742923
          packages: ''

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;27.2.12479018"

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm

      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          elif [ $MEMORY_GB -ge 6 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "" >> gradle.properties
            echo "org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1536M -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      - name: Staging Build
        id: staging_build_step
        env:
          COMMIT_ID: ${{ needs.sync.outputs.head_sha }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ vars.ALIAS_NAME || secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          if [ -n "$LOCAL_PROPERTIES" ]; then
            echo "$LOCAL_PROPERTIES" | base64 -d >> local.properties
          fi
          ./gradlew TMessagesProj:assembleStaging --build-cache --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NagramZ-${{ matrix.target }}
          path: TMessagesProj/build/outputs/apk/staging/*-${{ matrix.target }}.apk

  release:
    name: Create GitHub Release
    needs: [sync, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 1

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: apks
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify APK signature and branding
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check cryptography
          for apk in apks/*.apk; do
            echo "::group::Verifying $(basename "$apk")"
            python ci/verify-apk.py "$apk"
            echo "::endgroup::"
          done

      - name: Determine Version and Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ needs.sync.outputs.head_sha }}
        run: |
          set -euo pipefail
          APP_VER_NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          VER_CODE=$(grep 'def verCode =' TMessagesProj/build.gradle | head -n1 | tr -dc '0-9')
          SHORT_SHA=${COMMIT_SHA:0:7}

          TAG_NAME="v${APP_VER_NAME}.${VER_CODE}-${SHORT_SHA}"
          RELEASE_TITLE="NagramZ ${APP_VER_NAME} (${VER_CODE})"

          echo "Creating Release tag: $TAG_NAME"

          printf "%s\n" \
            "Automated build of NagramZ synchronized with upstream NiagramX." \
            "" \
            "- **Upstream Commit**: ${{ needs.sync.outputs.upstream_sha }}" \
            "- **NagramZ Commit**: ${{ needs.sync.outputs.head_sha }}" \
            "- **Target ABI**: arm64-v8a" \
            "- **Signature**: permanent NagramZ release certificate (SHA-256 \`abc77e8ae8b20436f66b7228bc466b47fc551fae2dc27a5531e7f3c33ff568fc\`)" \
            "- **Features**: Nagram animated splash screen and launcher icon" > release_notes.md

          gh release create "$TAG_NAME" apks/*.apk \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target dev
